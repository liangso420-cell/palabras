<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocab Trainer – Units 7 &amp; 8</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--accent:#2f6fed;--ok:#1f8a4c;--bad:#c0392b;--line:#dcdad2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#222428;--text:#eeeeea;--muted:#9a9a94;--accent:#6e9bff;--ok:#4cc57f;--bad:#ff7b6b;--line:#383a40;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181b;--card:#222428;--text:#eeeeea;--muted:#9a9a94;--accent:#6e9bff;--ok:#4cc57f;--bad:#ff7b6b;--line:#383a40;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button{flex:1 1 30%;padding:10px 2px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font-size:.9rem;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.count{color:var(--muted);font-size:.85rem;margin-bottom:8px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:220px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.word{font-size:2rem;font-weight:700}
.syn{font-size:1.6rem;font-weight:700;color:var(--accent);margin-bottom:10px}
.def{font-size:1.05rem}
.hint{color:var(--muted);font-size:.85rem;margin-top:12px}
.row{display:flex;gap:8px;margin-top:14px}
.row button,.next{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1rem;cursor:pointer}
.next{width:100%;margin-top:12px;background:var(--accent);color:#fff;border-color:var(--accent)}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px}
.q small{color:var(--muted);display:block;margin-bottom:6px}
.q p{margin:0;font-size:1.15rem}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1rem;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.fb{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);margin-top:4px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.big{text-align:center;padding:30px 10px}
input{width:100%;padding:13px 14px;font-size:1.05rem;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--text);margin-bottom:4px}
h3{font-size:1rem;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center}
.sm{padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.85rem}
.chip.g{background:color-mix(in srgb,var(--ok) 30%,var(--card));border-color:var(--ok);font-weight:600}
.chip.m{border-color:var(--bad);color:var(--bad)}
.muted{color:var(--muted);font-size:.9rem;margin:0}
.big b{font-size:2.4rem;display:block}
</style>
</head>
<body>
<main>
<h1>Vocab Trainer · Units 7 &amp; 8</h1>
<div class="tabs">
<button data-m="cards" class="on">Flashcards</button>
<button data-m="def">Definitions</button>
<button data-m="syn">Synonyms</button>
<button data-m="sent">Sentences</button>
<button data-m="test">Test</button>
</div>
<div id="app"></div>
</main>
<script>
const W=[
["Elite","Superior","A group of people considered the best or most powerful."],
["Crucial","Essential","Extremely important or necessary."],
["Absorb","Take in","To receive or understand information, energy, or liquid."],
["Eager","Enthusiastic","Very interested and excited to do something."],
["Monitor","Observe","To watch or check something over time."],
["Infrastructure","Framework","The basic systems and structures a place needs to function."],
["Drain","Deplete","To use up or reduce someone’s energy or resources."],
["Profile","Description","Information that describes a person, place, or thing."],
["Peak","Maximum","The highest point or level."],
["Prohibit","Forbid","To officially say that something is not allowed."],
["Stimulate","Encourage","To cause something to become more active or develop."],
["Steady","Consistent","Continuing at a regular or stable level."],
["Distressing","Upsetting","Causing worry, sadness, or discomfort."],
["Stunning","Astonishing","Extremely impressive or beautiful."],
["Peer","Equal","A person who belongs to the same age group or social level."],
["Make a living","Earn money","To get money to pay for everyday needs."],
["Worthy of","Deserving of","Good enough to receive or have something."],
["Penetrate","Enter","To go into or pass through something."],
["Apparel","Clothing","Clothes, especially when considered as a group or industry."],
["Dominate","Control","To have power or influence over something."],
["Endurance","Stamina","The ability to continue doing something difficult for a long time."],
["Indicator","Sign","Something that shows or suggests a particular condition."],
["Momentum","Drive","The force that helps something continue or develop."],
["Sincere","Genuine","Honest and expressing real feelings."],
["Capture","Attract","To get someone’s attention or interest."],
["Ruin","Destroy","To damage something so badly that it is no longer useful or successful."],
["Replicate","Reproduce","To make an exact or similar copy of something."],
["Potential","Possibility","The ability or possibility to develop or become successful."],
["Reveal","Disclose","To make something known that was previously hidden."],
["Show off","Display","To try to attract attention by displaying something."],
["Inferior","Lower","Not as good in quality, value, or importance."],
["Account","Report","A description or explanation of an event or situation."],
["Bounce","Rebound","To move back after hitting a surface."],
["Dimensions","Measurements","The size or measurements of something, such as its length, width, and height."],
["Distribution","Delivery","The process of giving or spreading something among different people or places."],
["Explosive","Rapid","Growing or developing very quickly and dramatically."],
["Frontier","Boundary","The limit or edge of an area or field of knowledge."],
["Have to do with","Relate to","To be connected with or associated with something."],
["Resistance","Opposition","The act of opposing or fighting against something."]
];
const app=document.getElementById("app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let mode="cards",order=sh(W.map((_,i)=>i)),ci=0,flip=false,Q=null;

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");mode=b.dataset.m;
  if(mode==="cards"){flip=false;cards()}else if(mode==="test")testIntro();else pStart(mode);
});

function cards(){
  const [w,s,d]=W[order[ci]];
  app.innerHTML=`<div class="count">${ci+1} / ${W.length}</div>
  <div class="card" id="card">${flip?`<div class="syn">${s}</div><div class="def">${d}</div><div class="hint">${full(order[ci])}</div>`:`<div class="word">${w}</div><div class="hint">Tap the card to see the synonym and definition</div>`}</div>
  <div class="row"><button id="pv">← Back</button><button id="sf">Shuffle</button><button id="nx">Next →</button></div>`;
  document.getElementById("card").onclick=()=>{flip=!flip;cards()};
  document.getElementById("pv").onclick=()=>{ci=(ci-1+W.length)%W.length;flip=false;cards()};
  document.getElementById("nx").onclick=()=>{ci=(ci+1)%W.length;flip=false;cards()};
  document.getElementById("sf").onclick=()=>{order=sh(order);ci=0;flip=false;cards()};
}

function start(m){
  Q={m,queue:sh(W.map((_,i)=>i)),score:0,done:0,missed:new Set(),cur:null};
  next();
}
function next(){
  if(!Q.queue.length){
    app.innerHTML=`<div class="q big"><b>${Q.score} / ${W.length}</b>correct on the first try<br><br>${Q.missed.size?"Words to review: "+[...Q.missed].map(i=>W[i][0]).join(", "):"Perfect round!"}</div><button class="next" id="again">Play again</button>`;
    document.getElementById("again").onclick=()=>start(Q.m);return;
  }
  const i=Q.queue.shift();Q.cur=i;
  const others=sh(W.map((_,k)=>k).filter(k=>k!==i)).slice(0,3);
  const opts=sh([i,...others]);
  const [w,s,d]=W[i];
  const prompt=Q.m==="def"?d:s;
  const label=Q.m==="def"?"Which word matches this definition?":"Which word has this synonym?";
  app.innerHTML=`<div class="bar"><i style="width:${Q.done/W.length*100}%"></i></div>
  <div class="q"><small>${label}</small><p>${prompt}</p></div>
  <div id="opts">${opts.map(k=>`<button class="opt" data-k="${k}">${W[k][0]}</button>`).join("")}</div><div id="fb"></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
  const i=Q.cur,ok=k===i,[w,s,d]=W[i];
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.k===i)b.classList.add("ok");else if(+b.dataset.k===k)b.classList.add("bad")});
  if(ok){Q.done++;if(!Q.missed.has(i))Q.score++}
  else{Q.missed.add(i);Q.queue.splice(Math.min(3,Q.queue.length),0,i)}
  document.getElementById("fb").innerHTML=`<div class="fb">${ok?"✓ Correct!":"✗ Not quite. We’ll ask this one again."}<br><b>${w}</b> – ${s} – ${d}</div><button class="next" id="nq">Next</button>`;
  document.getElementById("nq").onclick=next;
}
const S=[
"Only the ____ athletes in the country made it to the national team.",
"Sleep is ____ for good health.",
"Plants ____ water through their roots.",
"The students were ____ to start the new project.",
"Doctors ____ the patient’s heart rate all night.",
"Roads, bridges, and power lines are part of a city’s ____.",
"Working two jobs can ____ your energy.",
"The website asked me to complete my ____ with my name and interests.",
"Sales reached their ____ in December.",
"The school will ____ phones during exams.",
"Good teachers ____ students’ curiosity.",
"She keeps a ____ pace during the whole race.",
"The news about the accident was very ____.",
"The view from the top of the mountain was ____.",
"Teenagers often listen to their ____ more than to adults.",
"He plays guitar on the street to ____.",
"Her bravery is ____ respect.",
"The cold wind could ____ even thick coats.",
"That store sells sports ____, like shirts and shorts.",
"One large company tends to ____ the market.",
"Running a marathon requires great ____.",
"One important ____ of illness is a high fever.",
"The team gained ____ after winning three games in a row.",
"She gave a ____ apology and meant every word.",
"The colorful ad was made to ____ people’s attention.",
"Heavy rain can ____ an outdoor party.",
"Scientists try to ____ the experiment to check the results.",
"The young player has great ____ to become a star.",
"The company will ____ its new phone next week.",
"He likes to ____ his new car to everyone.",
"The cheap copy was ____ in quality to the original.",
"The witness gave her ____ of what happened.",
"The ball will ____ back when it hits the wall.",
"What are the ____ of the room? I need its length and width.",
"The ____ of food to poor families starts on Monday.",
"The company had ____ growth, doubling its size in a year.",
"Space is the last ____ of exploration.",
"Does this question ____ the topic we studied?",
"The workers showed strong ____ to the new rules."
];
const TL=["Which word matches this definition?","Which word has this synonym?","Which word completes the sentence?"];
const tp=q=>q.t===0?W[q.i][2]:q.t===1?W[q.i][1]:S[q.i];
let T=null;
function testIntro(){
  app.innerHTML=`<div class="q"><p><b>Real test mode</b></p><p style="font-size:1rem;margin-top:8px">No hints and no feedback until the end. Questions mix three types: definition, synonym, and fill in the blank. You see your score and your mistakes at the end.</p></div><button class="next" id="t20">Start test · 20 questions</button><button class="next" id="t39" style="background:var(--card);color:var(--text);border-color:var(--line)">Full test · 39 questions</button>`;
  document.getElementById("t20").onclick=()=>testStart(20);
  document.getElementById("t39").onclick=()=>testStart(39);
}
function testStart(n){
  const ids=sh(W.map((_,i)=>i)).slice(0,n);
  T={qs:ids.map((i,k)=>({i,t:k%3,opts:sh([i,...sh(W.map((_,x)=>x).filter(x=>x!==i)).slice(0,3)])})),n:0,ans:[]};
  testQ();
}
function testQ(){
  if(T.n>=T.qs.length)return testEnd();
  const q=T.qs[T.n];
  app.innerHTML=`<div class="bar"><i style="width:${T.n/T.qs.length*100}%"></i></div><div class="count">Question ${T.n+1} of ${T.qs.length}</div>
  <div class="q"><small>${TL[q.t]}</small><p>${tp(q)}</p></div>
  ${q.opts.map(k=>`<button class="opt" data-k="${k}">${W[k][0]}</button>`).join("")}`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{T.ans.push(+b.dataset.k);T.n++;testQ()});
}
function testEnd(){
  const wrong=T.qs.map((q,n)=>({q,n,a:T.ans[n]})).filter(x=>x.a!==x.q.i);
  const ok=T.qs.length-wrong.length,pct=Math.round(ok/T.qs.length*100);
  const msg=pct>=90?"Excellent! You are ready.":pct>=70?"Good job. Review the mistakes below.":"Keep practicing with the flashcards and quizzes, then retake the test.";
  app.innerHTML=`<div class="q big"><b>${ok} / ${T.qs.length} (${pct}%)</b>${msg}</div>
  ${wrong.length?`<h3>Your mistakes</h3>`+wrong.map(x=>{const [w,s,d]=W[x.q.i];return `<div class="fb" style="margin-bottom:8px"><b>Q${x.n+1}.</b> ${tp(x.q)}<br>Your answer: <span style="color:var(--bad)">${W[x.a][0]}</span><br>Correct: <b style="color:var(--ok)">${w}</b> – ${s} – ${d}</div>`}).join(""):""}
  <button class="next" id="rt">Take a new test</button>`;
  document.getElementById("rt").onclick=testIntro;
}
/* typed practice with word bank, green list and missed list */
let G=new Set(),R=new Set(),M=new Set(),P=null,bankOn=true;
try{const s=JSON.parse(localStorage.getItem("vt1")||"{}");G=new Set(s.g||[]);M=new Set(s.m||[])}catch(e){}
const save=()=>{try{localStorage.setItem("vt1",JSON.stringify({g:[...G],m:[...M]}))}catch(e){}};
const norm=s=>(s||"").toLowerCase().replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();
const bank=()=>`<div class="chips">${W.map((x,i)=>`<span class="chip${G.has(i)?" g":R.has(i)?" m":""}" id="c${i}">${x[0]}</span>`).join("")}</div>`;
const full=i=>S[i].replace("____",`<b>${W[i][0].toLowerCase()}</b>`);
const mlist=()=>M.size?[...M].map(i=>`<div class="fb" style="margin-bottom:6px"><b>${W[i][0]}</b> – ${W[i][1]} – ${W[i][2]}<br><i>${full(i)}</i></div>`).join("")+`<button class="next" id="pm">Practice missed words only</button>`:`<p class="muted">No missed words right now.</p>`;
function mRefresh(){const e=document.getElementById("ml");if(!e)return;e.innerHTML=mlist();const b=document.getElementById("pm");if(b)b.onclick=()=>pStart(P?P.m:"def",true)}
function pStart(m,only){
  const ids=only?[...M]:W.map((_,i)=>i);
  if(!ids.length)return;
  if(!only){G=new Set();R=new Set();save()}P={m,queue:sh(ids),done:false,cur:null};pNext();
}
function pNext(){
  if(!P.queue.length)return pEnd();
  const i=P.queue.shift();P.cur=i;P.done=false;
  const [w,s,d]=W[i];
  app.innerHTML=`<div class="count">Green: <b>${G.size}</b> / ${W.length} · Missed: <b>${M.size}</b> · Left in this round: ${P.queue.length+1}</div>
  <div class="q"><small>${P.m==="def"?"Type the word that matches this definition":P.m==="sent"?"Complete the sentence with a word from the word bank":"Type the word that has this synonym"}</small><p>${P.m==="def"?d:P.m==="sent"?S[i]:s}</p></div>
  <input id="ans" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type your answer">
  <div id="fb"></div><button class="next" id="ck">Check</button>
  <h3>Word bank <button class="sm" id="tg">${bankOn?"Hide":"Show"}</button></h3><div id="bk">${bankOn?bank():""}</div>
  <h3>Missed words</h3><div id="ml"></div>`;
  const act=()=>P.done?pNext():pCheck();
  document.getElementById("ck").onclick=act;
  const a=document.getElementById("ans");a.onkeydown=e=>{if(e.key==="Enter")act()};a.focus();
  document.getElementById("tg").onclick=()=>{bankOn=!bankOn;document.getElementById("bk").innerHTML=bankOn?bank():"";if(P.m==="sent")wireBank();document.getElementById("tg").textContent=bankOn?"Hide":"Show"};
  mRefresh();
  if(P.m==="sent")wireBank();
}
function wireBank(){
  document.querySelectorAll("#bk .chip").forEach(c=>{c.style.cursor="pointer";c.onclick=()=>{const a=document.getElementById("ans");if(!P.done){a.value=W[+c.id.slice(1)][0];a.focus()}}});
}
function pCheck(){
  const a=document.getElementById("ans"),i=P.cur,[w,s,d]=W[i],ok=norm(a.value)===norm(w);
  P.done=true;a.readOnly=true;a.style.borderColor=ok?"var(--ok)":"var(--bad)";
  const c=document.getElementById("c"+i);
  if(ok){G.add(i);R.delete(i);M.delete(i);if(c)c.className="chip g"}
  else{M.add(i);R.add(i);G.delete(i);P.queue.splice(Math.min(3,P.queue.length),0,i);if(c)c.className="chip m"}
  save();
  document.getElementById("fb").innerHTML=`<div class="fb">${ok?"✓ Correct!":"✗ The answer is"} <b>${w}</b> – ${s} – ${d}<br><i>${full(i)}</i></div>`;
  document.getElementById("ck").textContent="Next";
  mRefresh();
}
function pEnd(){
  app.innerHTML=`<div class="q big"><b>${G.size} / ${W.length}</b>words are green<br>${M.size?M.size+" on your missed list.":"No missed words. Great job!"}</div>
  <button class="next" id="pa">Practice all words again</button>
  <h3>Word bank</h3>${bank()}<h3>Missed words</h3><div id="ml"></div>`;
  document.getElementById("pa").onclick=()=>pStart(P.m);
  mRefresh();
}
/* typed test */
function testIntro(){
  app.innerHTML=`<div class="q"><p><b>Real test mode</b></p><p style="font-size:1rem;margin-top:8px">You type every answer. No word bank, no hints, and no feedback until the end. Questions mix definitions, synonyms, and fill in the blank. Words you miss go to your missed list.</p></div><button class="next" id="t20">Start test · 20 questions</button><button class="next" id="t39" style="background:var(--card);color:var(--text);border-color:var(--line)">Full test · 39 questions</button>`;
  document.getElementById("t20").onclick=()=>testStart(20);
  document.getElementById("t39").onclick=()=>testStart(39);
}
function testStart(n){
  T={qs:sh(W.map((_,i)=>i)).slice(0,n).map((i,k)=>({i,t:k%3})),n:0,ans:[]};testQ();
}
function testQ(){
  if(T.n>=T.qs.length)return testEnd();
  const q=T.qs[T.n],last=T.n===T.qs.length-1;
  app.innerHTML=`<div class="bar"><i style="width:${T.n/T.qs.length*100}%"></i></div><div class="count">Question ${T.n+1} of ${T.qs.length}</div>
  <div class="q"><small>${TL[q.t].replace("Which word","Type the word that").replace("matches","matches").replace("has this","has this").replace("completes","completes")}</small><p>${tp(q)}</p></div>
  <input id="ta" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type your answer"><button class="next" id="tn">${last?"Finish":"Next"}</button>`;
  const go=()=>{T.ans.push(document.getElementById("ta").value);T.n++;testQ()};
  document.getElementById("tn").onclick=go;
  const a=document.getElementById("ta");a.onkeydown=e=>{if(e.key==="Enter")go()};a.focus();
}
function testEnd(){
  const wrong=T.qs.map((q,n)=>({q,n,a:T.ans[n]})).filter(x=>norm(x.a)!==norm(W[x.q.i][0]));
  wrong.forEach(x=>M.add(x.q.i));save();
  const ok=T.qs.length-wrong.length,pct=Math.round(ok/T.qs.length*100);
  const msg=pct>=90?"Excellent! You are ready.":pct>=70?"Good job. Review the mistakes below.":"Keep practicing, then retake the test.";
  app.innerHTML=`<div class="q big"><b>${ok} / ${T.qs.length} (${pct}%)</b>${msg}</div>
  ${wrong.length?`<h3>Your mistakes (added to your missed list)</h3>`+wrong.map(x=>{const [w,s,d]=W[x.q.i];return `<div class="fb" style="margin-bottom:8px"><b>Q${x.n+1}.</b> ${tp(x.q)}<br>You typed: <span style="color:var(--bad)">${x.a.trim()||"(blank)"}</span><br>Correct: <b style="color:var(--ok)">${w}</b> – ${s} – ${d}</div>`}).join(""):""}
  <button class="next" id="rt">Take a new test</button>`;
  document.getElementById("rt").onclick=testIntro;
}
cards();
</script>
</body>
</html>
